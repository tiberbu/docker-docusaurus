name: buildx
on:
  push:
    branches:
      - master
jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Generate version
        id: version
        run: |
          PREV_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          MAJOR=$(echo $PREV_VERSION | cut -d. -f1)
          MINOR=$(echo $PREV_VERSION | cut -d. -f2)
          PATCH=$(echo $PREV_VERSION | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          while git rev-parse "refs/tags/$NEW_VERSION" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          done

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          git tag $NEW_VERSION

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region me-central-1 | docker login --username AWS --password-stdin 813389018368.dkr.ecr.me-central-1.amazonaws.com

      - name: Build and push to AWS ECR
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          tags: |
            ${{ secrets.ECR_REPOSITORY_URI }}:${{ steps.version.outputs.version }}
          push: true
